name: Game result
description: How a Switch game runs in Nightshade (or ProsperoEden) on your PS5
title: "[Compat] "
labels: ["compat-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Your result shows up on the [Nightshade Compat Log](https://oliv3rmoon.github.io/eden-ps5-compat/) within a minute or two.
        Don't post game files, keys, firmware or links to them.
  - type: input
    id: game
    attributes:
      label: Game
      description: Name, and the update version if you know it
      placeholder: Super Mario Odyssey 1.3.0
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: How it runs
      options:
        - Plays well
        - Plays with glitches
        - Starts, can't play
        - Won't start
        - Breaks with a mod
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App version
      description: Nightshade or ProsperoEden, as the home screen shows it
      placeholder: 1.005.100
  - type: input
    id: firmware
    attributes:
      label: PS5 system software
      placeholder: "9.60"
  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - PS5
        - PS5 Slim
        - PS5 Pro
        - PS5 Digital
  - type: input
    id: settings
    attributes:
      label: Settings
      placeholder: Vulkan, 1x, FSR, 1080p, 60 Hz
  - type: textarea
    id: notes
    attributes:
      label: What happened
      description: Where it crashes, frame rate, mods used, anything that helped. Paste a crash report here if you have one.
